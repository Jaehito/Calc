name: APK 빌드

# 개발 환경에서 dl.google.com 이 막혀 Android SDK 를 받을 수 없다.
# 빌드는 여기서 하고, 결과 APK 는 릴리스에 붙여 폰에서 바로 받게 한다.
on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:
    inputs:
      distribute:
        description: "Firebase App Distribution 으로 테스터에게 보내기"
        type: boolean
        default: false
      groups:
        description: "받을 테스터 그룹 (Firebase 콘솔의 그룹 별칭, 쉼표로 여러 개)"
        type: string
        default: "family"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK 준비
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # 파일 모드가 다시 644 로 되돌아가도 빌드가 죽지 않게 한다.
      - name: gradlew 실행 권한
        run: chmod +x android/gradlew

      - name: 단위 테스트
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK 빌드
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: 테스트 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: 폰에서 받을 수 있게 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          # 파일 이름에 브랜치를 넣는다. apk-latest 태그는 하나뿐이라
          # 나중에 빌드된 브랜치가 덮어쓰는데, 그때 어느 쪽인지 알 수 있어야 한다.
          SAFE_BRANCH="$(echo "$BRANCH" | tr '/' '-')"
          cp android/app/build/outputs/apk/debug/app-debug.apk "expense-$SAFE_BRANCH-$SHORT.apk"
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest \
            --target "$GITHUB_SHA" \
            --title "최신 APK · $BRANCH" \
            --notes "브랜치 \`$BRANCH\` · 커밋 \`$SHORT\` 로 빌드했습니다.

          아래 .apk 를 폰 브라우저에서 눌러 받으세요. 디버그 서명이라 «출처를 알 수 없는 앱 설치»를 허용해야 합니다.

          이 태그는 항상 **가장 최근에 빌드된 브랜치**의 APK 를 가리킵니다." \
            --prerelease \
            "expense-$SAFE_BRANCH-$SHORT.apk"

      # 테스터에게는 올릴 때마다 새 버전 알림이 간다. 커밋마다 가지 않게 손으로 돌릴 때만 올린다
      # (Actions › APK 빌드 › Run workflow › «보내기» 체크).
      # 필요한 것: 저장소 시크릿 FIREBASE_SERVICE_ACCOUNT (App Distribution 관리자 권한의 서비스
      # 계정 키 JSON 전체). 앱 ID 는 google-services.json 에 있어 따로 넣지 않는다.
      - name: App Distribution 으로 보내기
        if: github.event_name == 'workflow_dispatch' && inputs.distribute
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GROUPS: ${{ inputs.groups }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::시크릿 FIREBASE_SERVICE_ACCOUNT 가 없어 보내지 못했습니다."
            exit 1
          fi
          KEY="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY"
          APP_ID="$(jq -r '.client[] | select(.client_info.android_client_info.package_name=="com.calc.expense") | .client_info.mobilesdk_app_id' android/app/google-services.json)"
          npx --yes firebase-tools@13 appdistribution:distribute \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --app "$APP_ID" \
            --groups "$GROUPS" \
            --release-notes "브랜치 ${GITHUB_REF_NAME} · 커밋 ${GITHUB_SHA::7}"
          rm -f "$KEY"
